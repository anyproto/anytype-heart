info:
  contact:
    email: support@anytype.io
    name: Anytype Support
    url: https://anytype.io/contact
  description: |-
    The agent-oriented Anytype local API. An object is one AnyBlock JSON document rather than a tree of blocks, so a single GET returns a whole editable document and a single PATCH edits it.
    Everything this API names for itself is snake_case: path and query parameters, request and response fields, and the names of the PATCH ops. Things are addressed by name rather than by id: property keys, option names, and `type` as a type key. Object ids remain ids.
    Property and type keys have two spellings, and a served body picks one. The default is the key: a snake_case slug minted when the property was created and frozen from then on, so it survives every rename. Store that spelling in a config, a script, an integration. `?keys=name` on a read serves the display-name vocabulary instead, "Due date" rather than due_date, which is the spelling to show a user their own words. Input needs no such choice: every channel accepts both, plus the forgiving fold between them, so dueDate, due-date, "Due date" and Дата выполнения all address the property they name. A spelling matching two properties is a 400 listing both, and an unknown one never creates anything.
    Responses are compact. A list or search row carries id, name, type and the properties you asked for, and never embeds a type object. Object references are always full and inline. An object read relabels machine-minted block ids to short document-local suffixes; `?ids=full` returns the export shape, with full ids everywhere, which is the shape to store and the shape to clone from.
    Wherever a block or a view is addressed by id, a full id or a unique suffix of one is accepted. That is what lets a document read back in the compact shape be edited exactly as it came back. A suffix that matches several elements is refused, and the refusal lists the candidates.
    A read never fails on content it cannot represent. Whatever a representation cannot express is reported in `warnings` beside the result.
    Every error has one shape: {status, code, message, issues:[{path, message, hint}]}. Each issue is addressed by path and names the values that would have been accepted, so a failed call tells you how to repair it.
    Authentication uses an opaque Anytype API key as a bearer credential in the Authorization header; the key is not a JWT. It is never read from a query or body parameter. An unknown, revoked or expired key is a 401.
    An object read returns an `etag` in the body and an ETag header. A mutation takes that etag back in `If-Match`, where it is advisory: without the header the last write wins, and a stale one is a 409 carrying the current etag. Chats are the exception. They have no etag, because their order ids and `last_state_id` do that job.
    Every mutation and the data-free `POST /validate` read accept an `Idempotency-Key` header. The same key with the same request replays the stored response instead of repeating the operation. Search is a read carried by POST and takes no key.
    Every mutation accepts `?dry_run=true`. It validates the request, reports what would have happened and writes nothing, answering 200 where the real call would answer 201. Where a dry run cannot tell the whole truth, the operation says so.
    Every list is paginated with `?offset=` and `?limit=`, 25 rows by default. The response carries `total`, `has_more` and, when it truncated, a hint for narrowing the request. Chat messages page by order-id cursor instead.
    Request bodies bind strictly: an unknown field is a 400 naming the field, never a value silently dropped. A document body is capped at 10 MiB, a structured body at 1 MiB.
    Deleting an object, a type or a property archives it: it moves to Bin, and the Anytype app can restore it. Deleting a chat message is not an archive, and neither is the attachment cleanup that can follow it.
    Schemas are discoverable at runtime, and strict enough to decode against: GET /v2/schemas lists the kinds, GET /v2/schemas/{kind} returns one, and GET /v2/schemas/ops/{op} returns the schema of a single edit op.
    A space is served by a short reference: the last six characters of the first half of its id. Every route that takes a space accepts either that short reference or the full `<cid>.<replicationKey>` id. Resolution tries an exact id first, then a unique suffix, among the spaces the key can see. An ambiguous reference is a 400 listing the candidates, and two spaces whose tails collide are both served in full.
    A short reference is an addressing convenience, not a stable identifier. It is unique only against the spaces the key can currently see, so joining a space whose tail collides retires it. `?ids=full` spells every space id in the response out in full. Use it whenever a reference will be stored outside this API: a config file, a script, a log line, another system.
  license:
    name: Any Source Available License 1.0
    url: https://github.com/anyproto/anytype-api/blob/main/LICENSE.md
  termsOfService: https://anytype.io/terms_of_use
  title: Anytype API v2
  version: "2025-11-08"
openapi: 3.1.0
paths:
  /v2/auth/whoami:
    get:
      description: This describes the key, not a person; there is one account behind
        this API. Branch on `grant.scoped`. False is a legacy key with no space restriction,
        and its `spaces` list is empty rather than absent. True means the key reaches
        exactly the spaces listed, with the permission listed beside each one.
      operationId: auth_whoami
      parameters:
      - description: 'How grant.spaces[].id is spelled: compact (default) is the short
          space reference; full is the whole <cid>.<replicationKey> id, and the spelling
          to store outside this API'
        in: query
        name: ids
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
          description: The key's grant, as it is enforced
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerauth: []
      summary: Describe the calling key
      tags:
      - Auth
  /v2/schemas:
    get:
      operationId: list_schemas
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaIndex'
          description: Schema index
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerauth: []
      summary: List the available schemas
      tags:
      - Schemas
  /v2/schemas/{kind}:
    get:
      operationId: get_schema
      parameters:
      - description: Schema kind, as listed by GET /v2/schemas
        in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEntry'
          description: Schema + example
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown kind
      security:
      - bearerauth: []
      summary: Get the schema for one kind
      tags:
      - Schemas
  /v2/schemas/ops/{op}:
    get:
      description: The example is a single op object, ready to drop into an edit request's
        `ops` array, not a whole request body.
      operationId: get_op_schema
      parameters:
      - description: 'Op name: set_properties, update_block, replace_subtree, insert_blocks,
          move_block, delete_block, replace_text, set_cell, update_view, insert_view,
          move_view, delete_view, add_items, remove_items'
        in: path
        name: op
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEntry'
          description: Schema + example
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown op
      security:
      - bearerauth: []
      summary: Get the schema for one edit op
      tags:
      - Schemas
  /v2/search:
    post:
      description: Type keys and option names are resolved per space. A name that
        resolves in only some spaces searches those and warns about the rest. `total`
        is the sum of the per-space counts, and each row carries its `space_id`.
      operationId: search_global
      parameters:
      - description: Items to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      - description: Items to return
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: 'How each row''s space_id is spelled: compact (default) is the
          short space reference; full is the whole <cid>.<replicationKey> id, and
          the spelling to store outside this API'
        in: query
