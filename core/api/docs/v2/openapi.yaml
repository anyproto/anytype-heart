          description: New etag + diffStats
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid document
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object or space not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale If-Match (etag_mismatch)
      security:
      - bearerauth: []
      summary: Replace object (full AnyBlock document)
      tags:
      - V2
