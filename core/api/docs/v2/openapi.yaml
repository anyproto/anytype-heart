      - description: Return only this block's subtree
        in: query
        name: block
        schema:
          type: string
      - description: compact (default) is the edit shape, where minted block ids relabel
          to short suffixes; full is the export shape, with full ids everywhere, and
          the shape to send back. Object references are full and inline in both.
        in: query
        name: ids
        schema:
          type: string
      - description: anyblock (default) or md
        in: query
        name: format
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: The flat AnyBlock document + etag
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Illegal parameter combination (ambiguous_input)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object or space not found
      security:
      - bearerauth: []
      summary: Get an object
      tags:
      - Objects
    patch:
      description: Applies ops in order as one atomic edit. A failed op or invalid
        result leaves the object unchanged. Text locators must match exactly one block.
        New block and view IDs are returned by payload position in `created_blocks`
        and `created_views`, compact by default or full with `ids=full`.
      operationId: patch_object
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Object id
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: The etag the object must still carry
        in: header
        name: If-Match
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: ID spelling in created_blocks and created_views
        in: query
        name: ids
        schema:
          default: compact
          enum:
          - compact
          - full
          type: string
      - description: 'Create select options for names the property does not hold yet
          (default false: an unmatched name is refused)'
        in: query
        name: create_missing_options
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                ops:
                  description: applied in order as one edit, and if any one is refused none is applied. Each op's members, schema and example come from get_op_schema with its op name
                  items:
                    properties:
                      op:
                        enum:
                          - set_properties
                          - set_type
                          - update_block
                          - replace_subtree
                          - insert_blocks
                          - move_block
                          - delete_block
                          - replace_text
                          - set_cell
                          - update_view
                          - insert_view
                          - move_view
                          - delete_view
                          - add_items
                          - remove_items
                        type: string
                    required:
                      - op
                    type: object
                  maxItems: 512
                  minItems: 1
                  type: array
              required:
                - ops
              type: object
        description: Ops envelope, an array of ops applied as one edit
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditResult'
          description: New etag + created block ids + diff_stats
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid ops or post-op document
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object, space, or referenced block not found
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Existing content cannot be represented losslessly for this
            edit
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Update an object
      tags:
      - Objects
  /v2/spaces/{space_id}/objects/{object_id}/discussion:
    post:
      description: 'A discussion is the comment thread under an object, and it is
        a chat: the returned id is the `chat_id` for every chat operation, where `reply_to`
        makes a threaded reply. An object that already has one answers 200 with the
        same id and no `created`, so the call is safe to repeat. An object read serves
        the id as `discussion`. Chats, types, templates and system objects cannot
        hold one.'
      operationId: create_discussion
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Object id
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: Report whether the object has a discussion without creating one
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Replay guard: the same key with the same body replays the stored
          response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionResult'
          description: The object already has a discussion, or a dry run
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionResult'
          description: Discussion created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A chat, or an object that cannot hold a discussion
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object or space not found
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Start an object's discussion
      tags:
      - Chat
