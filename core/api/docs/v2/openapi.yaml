info:
  contact:
    email: support@anytype.io
    name: Anytype Support
    url: https://anytype.io/contact
  description: |-
    The agent-oriented Anytype local API. Objects are AnyBlock JSON documents (pkg/lib/anyblockjson/SPEC.md) rather than block trees, so one read returns a whole editable document and one PATCH edits it.
    One vocabulary throughout (C2): camelCase, property keys, option names, and `type` as a type key — never an id, never snake_case. Responses are compact JSON (C3); object refs are always full inline, and the default object read relabels machine-minted block ids to short doc-local suffixes — `?ids=full` returns the export shape with full ids everywhere, the shape that PUTs back (C4); list and search rows carry id, name, type and the properties you asked for, and never embed type objects (C5).
    Errors share one shape (C6): {status, code, message, issues:[{path, message, hint}]}, path-addressed and naming the allowed values, so a failed call tells an agent how to repair it. Reads never fail on unknown content — anything a representation cannot express is reported in `warnings` (C11).
    Every object read returns an `etag` derived from the tree heads plus an ETag header; mutations take `If-Match` and are advisory by default (C7). Every mutation honours `Idempotency-Key` (C8) and `?dry_run=true` (C9). Every list surface is paginated with limit=25 by default and steers you when it truncates (C10).
    Schemas are discoverable at runtime and strict-mode-compatible for constrained decoding (C12, C13): GET /v2/schemas lists the kinds, GET /v2/schemas/{kind} returns one, and GET /v2/schemas/ops/{op} returns the schema of a single PATCH op.
  license:
    name: Any Source Available License 1.0
    url: https://github.com/anyproto/anytype-api/blob/main/LICENSE.md
  termsOfService: https://anytype.io/terms_of_use
  title: Anytype API v2
  version: "2025-11-08"
openapi: 3.1.0
paths:
  /v2/auth/whoami:
    get:
      description: 'Describes the CREDENTIAL presented in the Authorization header
        — never the person; there is only one account on this API. `grant.scoped`
        is the load-bearing field: false means a legacy unscoped key (then `spaces`
        is `[]` and `permission` is null — never null spaces), true means enforcement
        constrains the key to exactly the listed spaces with the listed permission.
        `spaces[]` entries carry a per-entry `permission` (uniform today; per-space
        grants land without a wire change) and a `name` resolved through the same
        grant-intersected path as GET /v2/spaces. `keyStatus`/`notice` repeat the
        Anytype-Key-Status/Anytype-Notice header signal in the body. The token is
        read ONLY from the Authorization header; it is never accepted as a query or
        body parameter, and an unknown or revoked key gets a plain 401.'
      operationId: v2_auth_whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
          description: The credential's grant as enforced
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
          description: Missing, unknown, revoked or expired key — the shared auth
            middleware's envelope (APIV2.md §8.9 seam), not the C6 shape
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: Key scope does not admit the JSON API (e.g. Limited) — the
            shared scope gate's envelope
      security:
      - bearerauth: []
      summary: Introspect the API key
      tags:
      - V2
  /v2/schemas:
    get:
      description: 'The §5 discovery index: every create kind with its endpoint and
        schema URL.'
      operationId: v2_list_schemas
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaIndex'
          description: Schema index
      security:
      - bearerauth: []
      summary: List schemas
      tags:
      - V2
  /v2/schemas/{kind}:
    get:
      description: 'One kind''s JSON Schema and worked example (C12/C13). Kinds: object,
        shortcut, type, template, property, set, collection, file, filters.'
      operationId: v2_get_schema
      parameters:
      - description: Schema kind
        in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEntry'
          description: Schema + example
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown kind
      security:
      - bearerauth: []
      summary: Get schema for a kind
      tags:
      - V2
  /v2/schemas/ops/{op}:
    get:
      description: 'One op''s tiny strict schema (C13) and a single-op minimal example.
        Ops: setProperties, updateBlock, replaceSubtree, insertBlocks, moveBlock,
        deleteBlock, replaceText, setCell, addItems, removeItems.'
      operationId: v2_get_op_schema
      parameters:
      - description: Op name
        in: path
        name: op
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEntry'
          description: Schema + example
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown op
      security:
      - bearerauth: []
      summary: Get schema for a PATCH op
      tags:
      - V2
  /v2/search:
    post:
      description: 'Searches all spaces: type keys and option names resolve per space
        (a reference that resolves in only some spaces queries those and warns about
        the rest), results merge by the requested sort, total is the sum of per-space
        store counts (honest totals). Rows carry spaceId. Same request shape as the
        space search.'
      operationId: v2_search_global
      parameters:
      - description: Items to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      - description: Items to return
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestDoc'
        description: Search request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse-ObjectRow'
          description: Minimal object rows with spaceId
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
      security:
      - bearerauth: []
      summary: Search objects (global)
      tags:
      - V2
  /v2/spaces:
    get:
      description: Returns {id, name, description} rows for the account's LIVE spaces
        — deleted, left and still-joining spaces are filtered out (the same predicate
        GET /v2/spaces/{space_id} and the global search use).
      operationId: v2_list_spaces
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse-SpaceRow'
          description: Minimal space rows
      security:
      - bearerauth: []
      summary: List spaces (minimal rows)
      tags:
      - V2
    post:
      description: 'Creates a space: {name, description?} → the same shape. Thin over
        WorkspaceCreate. Both fields are capped at 4096 characters (the space kind''s
        advertised maxLength — enforced). Honors Idempotency-Key (C8) — an auto-retried
        space create without a key duplicates an entire space — and ?dry_run=true
        (C9): the dry run validates the body only, a space create cannot be simulated.'
      operationId: v2_create_space
      parameters:
      - description: Validate the body without creating
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'C8 replay guard: the same key with the same body replays the
          stored response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
        description: The space to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
          description: Created space
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation failure
      security:
      - bearerauth: []
      summary: Create space
      tags:
      - V2
  /v2/spaces/{space_id}:
    get:
      description: 'Returns the space row {id, name, description} read from the tech
        space''s space view — one store query, no workspace opens. Only LIVE spaces
        are served: a deleted, left or still-joining space 404s (the same predicate
        as the spaces list). gatewayUrl/networkId are client-infrastructure fields
        and are deliberately absent from v2.'
      operationId: v2_get_space
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
          description: The space row
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Space not found
      security:
      - bearerauth: []
      summary: Get space
      tags:
      - V2
    patch:
      description: Updates the space's name and/or description (omitted fields stay
        unchanged; at least one is required; 4096-character cap) → the resulting row.
        Thin over WorkspaceSetInfo. A space that is deleted or gone answers 404; a
        role that may not change the space info answers 403. Honors Idempotency-Key
        (C8) and ?dry_run=true (C9).
      operationId: v2_update_space
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: C8 replay guard
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
        description: The fields to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
          description: The updated space row
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation failure
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The caller's role cannot change the space info
        "404":
          content:
            application/json:
              schema:
