  /v2/spaces/{space_id}/queries:
    post:
      description: Filter and sort property keys are checked against the type the
        query runs over; a key that type does not carry is refused.
      operationId: create_query
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Create select options for names the property does not hold yet
          (default false: an unmatched name is refused)'
        in: query
        name: create_missing_options
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              allOf:
                - not:
                    properties:
                      filter:
                        minLength: 1
                    required:
                      - filter
                      - filters
                - not:
                    properties:
                      filter:
                        minLength: 1
                    required:
                      - views
                      - filter
                - not:
                    required:
                      - views
                      - filters
                - not:
                    required:
                      - views
                      - sorts
              properties:
                filter:
                  description: compact filter string (grammar on kind filters), an alternative to the structured filters array; a body sends at most one of the two
                  maxLength: 4096
                  type: string
                filters:
                  description: structured filter nodes (schema kind filters), an alternative to the compact filter string; a body sends at most one of the two
                  items:
                    $ref: '#/components/schemas/FilterNode'
                  maxItems: 50
                  type: array
                name:
                  maxLength: 4096
                  type: string
                sorts:
                  items:
                    additionalProperties: false
                    properties:
                      direction:
                        enum:
                          - asc
                          - desc
                        type: string
                      empty_placement:
                        enum:
                          - start
                          - end
                        type: string
                      property:
                        maxLength: 256
                        type: string
                    required:
                      - property
                    type: object
                  maxItems: 10
                  type: array
                type:
                  description: the queried type's key
                  maxLength: 256
                  type: string
                views:
                  description: 'the query''s views, each whole: the fields the insert_view op''s set takes (except filter: write a view''s filters as nodes here), plus its columns. Mutually exclusive with top-level filter/sorts, which build one view named All'
                  items:
                    properties:
                      alternate_rows:
                        type: boolean
                      card_size:
                        enum:
                          - small
                          - medium
                          - large
                        type: string
                      colored_groups:
                        type: boolean
                      columns:
                        items:
                          additionalProperties: false
                          properties:
                            aggregation:
                              enum:
                                - count
                                - count_value
                                - count_distinct
                                - count_empty
                                - count_not_empty
                                - percent_empty
                                - percent_not_empty
                                - sum
                                - average
                                - median
                                - min
                                - max
                                - range
                              type: string
                            align:
                              enum:
                                - left
                                - center
                                - right
                                - justify
                              type: string
                            hidden:
                              type: boolean
                            property:
                              maxLength: 256
                              type: string
                            width:
                              maximum: 10000
                              minimum: 0
                              type: integer
                          required:
                            - property
                          type: object
                        maxItems: 64
                        type: array
                      cover_fit:
                        type: boolean
                      cover_property:
                        maxLength: 256
                        type: string
                      default_template_id:
                        maxLength: 256
                        type: string
                      default_type_id:
                        maxLength: 256
                        type: string
                      end_property:
                        maxLength: 256
                        type: string
                      filters:
                        description: filter nodes (schema kind filters), at most 32 at the top level (group more under and/or nodes); a created view takes nodes only; the compact string is the query's top-level filter
                        items:
                          $ref: '#/components/schemas/AnyValue'
                        maxItems: 32
                        type: array
                      group_by:
                        description: property key to group by (kanban/board views)
                        maxLength: 256
                        type: string
                      hide_icon:
                        type: boolean
                      list_size:
                        enum:
                          - compact
                          - regular
                        type: string
                      name:
                        maxLength: 4096
                        type: string
                      page_size:
                        maximum: 1000
                        minimum: 0
                        type: integer
                      sorts:
                        items:
                          additionalProperties: false
                          properties:
                            custom_order:
                              items:
                                $ref: '#/components/schemas/AnyValue'
                              maxItems: 128
                              type: array
                            direction:
                              enum:
                                - asc
                                - desc
                                - custom
                              type: string
                            empty_placement:
                              enum:
                                - start
                                - end
                              type: string
                            id:
                              description: output-only on reads; accepted back so a read sort round-trips
                              maxLength: 64
                              type: string
                            include_time:
                              type: boolean
                            no_collate:
                              type: boolean
                            property:
                              maxLength: 256
                              type: string
                          required:
                            - property
                          type: object
                        maxItems: 10
                        type: array
                      type:
                        enum:
                          - table
                          - list
                          - gallery
                          - kanban
                          - calendar
                          - graph
                        type: string
                      wrap_content:
                        type: boolean
                    required:
                      - name
                    type: object
                    unevaluatedProperties: false
                  maxItems: 10
                  type: array
              required:
                - name
                - type
              type: object
        description: Query to create
        required: true
      responses:
        "200":
          content:
            application/json:
