        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChallengeResponse'
          description: The challenge ID associated with the started challenge
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Bad request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: Untrusted request origin or host
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: Internal server error
      summary: Create Challenge
      tags:
      - Auth
  /v2/auth/whoami:
    get:
      description: This describes the key, not a person; there is one account behind
        this API. Branch on `grant.scoped`. False is a legacy key with no space restriction,
        and its `spaces` list is empty rather than absent. True means the key reaches
        exactly the spaces listed. When `grant.all_spaces` is true the key covers
        every space, including ones created later, and `spaces` is informational only.
      operationId: auth_whoami
      parameters:
      - description: 'How grant.spaces[].id is spelled: compact (default) is the short
          space reference; full is the whole <cid>.<replicationKey> id, and the spelling
          to store outside this API'
        in: query
        name: ids
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
          description: The key's grant, as it is enforced
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerauth: []
      summary: Describe the calling key
      tags:
      - Auth
