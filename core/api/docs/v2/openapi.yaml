    post:
      description: 'Adds a widget for an object to the space sidebar (scope space,
        owner and admins) or to this account''s own (scope personal, any member who
        can write). One widget per target per scope. The layout and limit follow the
        app''s own rules: a layout the target cannot render, or a limit off the app''s
        list, is replaced with the app''s fallback and reported in warnings.'
      operationId: create_widget
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Replay guard: the same key with the same body replays the stored
          response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              allOf:
                - not:
                    required:
                      - after
                      - before
                - not:
                    required:
                      - after
                      - position
                - not:
                    required:
                      - before
                      - position
              description: a sidebar widget. POST needs target and scope; PATCH takes the rest, all optional, at least one
              properties:
                after:
                  description: id or target of the sidebar widget to place this one after. At most one of after, before and position; on PATCH, none of the three keeps the position
                  maxLength: 256
                  minLength: 1
                  type: string
                before:
                  description: id or target of the sidebar widget to place this one before
                  maxLength: 256
                  minLength: 1
                  type: string
                layout:
                  description: 'how the widget renders. Omitted on POST, the target''s kind picks it: tree for a page, view for a query, collection or type, link for everything else. A layout the target cannot render is replaced with the one it can, with a warning'
                  enum:
                    - link
                    - tree
                    - list
                    - compact_list
                    - view
                  type: string
                limit:
                  description: 'how many entries a listing shows, from the app''s own pick-list: 6, 10, 14, 30 or 50, or 4, 6, 8, 30, 50 for the list layout; any other value is stored as the smallest, with a warning. Omitted on POST, the smallest; omitted on PATCH, the stored limit stays unless a new layout''s list lacks it. Not taken by link'
                  type: integer
                position:
                  description: first or last in the sidebar, last meaning before the bin widget when that is last; omitted with no after or before, a POST goes last
                  enum:
                    - first
                    - last
                  type: string
                scope:
                  description: space is the sidebar every member sees, written by the owner and admins; personal is this account's own sidebar in the space. Required on POST
                  enum:
                    - space
                    - personal
                  type: string
                target:
                  description: id of the object the widget points at. Required on POST, refused on PATCH. Built-in listings cannot be added
                  maxLength: 256
                  minLength: 1
                  type: string
                view_id:
                  description: which of the target's views a view widget shows. Only a query, collection or type target has views, and only a space widget keeps one
                  maxLength: 256
                  type: string
              required:
                - target
                - scope
              type: object
        description: Widget to create
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResult'
          description: Dry run; validation result without committing
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResult'
          description: The widget as stored
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Validation failure: the target is missing, archived, a property,
            a template or a built-in listing, or the sidebar already holds it'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "413":
          $ref: '#/components/responses/RequestTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Create a widget
      tags:
      - Widgets
  /v2/spaces/{space_id}/widgets/{widget_id}:
    delete:
      description: Removes the widget from its sidebar. The object it pointed at is
        untouched. The path names the widget by its id or by its target; a target
        the sidebar holds in both scopes needs `scope`.
      operationId: delete_widget
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Widget id, or the id of the object the widget points at
        in: path
        name: widget_id
        required: true
        schema:
          type: string
      - description: space or personal, when the target is in both
        in: query
        name: scope
        schema:
          type: string
      - description: Report without removing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Replay guard: the same key replays the stored response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResult'
          description: The removed widget
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A target held in both scopes without scope
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No widget with this id or target
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Delete a widget
      tags:
      - Widgets
    patch:
      description: 'Changes the layout, the limit or the view of a widget, or moves
        it with after, before or position. The path names the widget by its id or
        by its target; a target the sidebar holds in both scopes needs `scope`. The
        target itself does not change: delete the widget and create one for the other
        object.'
      operationId: update_widget
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Widget id, or the id of the object the widget points at
        in: path
        name: widget_id
        required: true
        schema:
          type: string
      - description: space or personal, when the target is in both
        in: query
        name: scope
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Replay guard: the same key with the same body replays the stored
          response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              allOf:
                - not:
                    required:
                      - after
                      - before
                - not:
                    required:
                      - after
                      - position
                - not:
                    required:
                      - before
                      - position
              description: the members to change, every one optional; at least one. The target and the scope are the widget's identity and are refused here
              minProperties: 1
              properties:
                after:
                  description: id or target of the sidebar widget to move this one after. At most one of after, before and position; omitted, the widget keeps its position
                  maxLength: 256
                  minLength: 1
                  type: string
                before:
                  description: id or target of the sidebar widget to move this one before
                  maxLength: 256
                  minLength: 1
                  type: string
                layout:
                  description: 'link, tree, list, compact_list or view. The layout and the limit are re-validated as a pair whenever either is sent: a layout the target cannot render is replaced with the one it can, with a warning, and a stored layout the target cannot render is replaced the same way on a limit change'
                  enum:
                    - link
                    - tree
                    - list
                    - compact_list
                    - view
                  type: string
                limit:
                  description: 'how many entries a listing shows, from the app''s own pick-list: 6, 10, 14, 30 or 50, or 4, 6, 8, 30, 50 for the list layout; any other value is stored as the smallest, with a warning. Omitted, the stored limit stays, re-fitted to the list of a new layout when that list does not hold it. With the link layout the stored limit stays untouched and a sent one is not stored'
                  type: integer
                position:
                  description: first or last in the sidebar, last meaning before the bin widget when that is last
                  enum:
                    - first
                    - last
                  type: string
                view_id:
                  description: which of the target's views a view widget shows, by view id; an empty string returns to the target's first view. Only a query, collection or type target has views, and only a space widget keeps one
                  maxLength: 256
                  type: string
              type: object
        description: The members to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResult'
          description: The widget as stored
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation failure, or a target held in both scopes without
            scope
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No widget with this id or target
        "409":
          $ref: '#/components/responses/Conflict'
        "413":
          $ref: '#/components/responses/RequestTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Update a widget
      tags:
      - Widgets
  /v2/validate:
    post:
      description: 'Structure and format rules only. Nothing is resolved against a
        space, so option names and a type''s property keys are not checked here. Findings
        come back as data: an invalid document is still a 200, carrying the issues,
        and a valid one carries empty lists.'
      operationId: validate
      parameters:
      - description: Retry key; identical requests replay, different requests conflict
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: an AnyBlock document of any kind, checked without being stored; its schema and a worked example come from get_schema with kind document
              type: object
        description: Document to validate
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
          description: Issue and warning lists, empty when the document is valid
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
      security:
      - bearerauth: []
      summary: Validate an AnyBlock document
      tags:
      - Schemas
servers:
- url: http://127.0.0.1:31009
tags:
- description: Obtain an API key with Desktop approval, then inspect which spaces
    and permissions it grants.
  name: Auth
- description: The containers everything else lives in. Nearly every other route is
    scoped to one.
  name: Spaces
- description: 'Read and write whole AnyBlock documents: one GET returns an editable
    document, one PATCH edits it.'
  name: Objects
- description: Find objects by query, filter and sort, within one space or across
    all of them.
  name: Search
- description: 'An object''s shape: the properties it recommends and the views it
    opens with.'
  name: Types
- description: The typed key-value fields objects carry, and the option vocabularies
    select fields draw from.
  name: Properties
- description: Sets (a live query over a type) and collections (a hand-curated list),
    with their views.
  name: Lists
- description: Messages, reactions and read state. Chats store messages outside blocks,
    paged by order-id cursors.
  name: Chat
- description: Who is in a space, and which of them you are.
  name: Members
- description: Upload files and download file or icon content.
  name: Files
- description: Starting documents for a type.
  name: Templates
- description: 'The sidebar: which objects a space pins for every member, and which
    this account keeps for itself.'
  name: Widgets
- description: 'The format itself: what a valid document looks like, what each PATCH
    op accepts, and a validator to check one against them. Read these before writing.'
  name: Schemas
