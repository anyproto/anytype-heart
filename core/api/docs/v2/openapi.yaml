      security:
      - bearerauth: []
      summary: Get object (AnyBlock)
      tags:
      - V2
    patch:
      description: 'Applies the closed, id-addressed op set — setProperties, updateBlock,
        replaceSubtree, insertBlocks, moveBlock, deleteBlock, replaceText, setCell,
        updateView, insertView, moveView, deleteView, addItems, removeItems — atomically
        (one change set). Block references accept full ids and unique suffixes. The
        post-op document must satisfy the AnyBlock semantic checks (SPEC §12); any
        violation rejects the whole PATCH with path-addressed errors. If-Match is
        advisory (C7): absent = last-write-wins, stale = 409 with the current etag.
        Responds with the new etag, the created-block id map keyed by payload position,
        and diffStats. Honors ?dry_run=true (C9). GET /v2/schemas/ops/{op} documents
        each op.'
      operationId: v2_patch_object
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Object id
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: Advisory etag precondition (C7)
        in: header
        name: If-Match
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditResult'
          description: New etag + created block ids + diffStats
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid ops or post-op document
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object, space, or referenced block not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale If-Match (etag_mismatch)
      security:
      - bearerauth: []
      summary: Edit object (batched ops)
      tags:
      - V2
    put:
      description: 'Replaces the object''s content with the supplied flat AnyBlock
        document in one change set. Read the object with ?ids=full first: PUT takes
        ids literally, and a body carrying ids the object does not own — including
        the compact labels a DEFAULT read serves — is refused with a 400 naming the
        offending ids. New blocks omit their id (the server mints one). The CRDT diff
        is minimal iff the ids round-trip from that ?ids=full read; diffStats make
        an accidental full rewrite visible. Partial reads (?block= subtrees, outlines)
        do not PUT back. Prefer PATCH for targeted edits. If-Match is advisory (C7).
        System-managed objects are excluded. Honors ?dry_run=true.'
      operationId: v2_put_object
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Object id
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: Advisory etag precondition (C7)
        in: header
        name: If-Match
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      requestBody:
