  /v2/spaces/{space_id}/chats/{chat_id}/messages:
    get:
      description: '`after` on its own walks forward, oldest first, continuing from
        `next_after`. Every other query, including `after` together with `before`,
        is anchored at the newest end of the range and walks backward from `next_before`.
        Both bounds are exclusive. `message_count` is the chat''s total since it began,
        not the size of the range. Offset paging does not apply here, and `offset`
        is refused.'
      operationId: get_chat_messages
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Chat object id
        in: path
        name: chat_id
        required: true
        schema:
          type: string
      - description: Return messages after this order id (exclusive)
        in: query
        name: after
        schema:
          type: string
      - description: Return messages before this order id (exclusive)
        in: query
        name: before
        schema:
          type: string
      - description: Messages to return
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: counts (default) returns the emoji counts; full adds the participant
          ids behind each count
        in: query
        name: reactions
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
          description: Messages + state + message_count
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not a chat, or invalid params
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Chat not found
      security:
      - bearerauth: []
      summary: List chat messages
      tags:
      - Chat
    post:
      description: The text is markup source, so `*`, `[` and a mention tag mint real
        marks; escape a literal one with a backslash. The cap is 8000 UTF-16 code
        units, where one emoji can cost two or more. Attachments are object ids, at
        most 32, and each one's kind is taken from the target's layout.
      operationId: add_chat_message
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Chat object id
        in: path
        name: chat_id
        required: true
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Replay guard: the same key with the same body replays the stored
          response'
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChatMessageRequest'
        description: The message to send
        required: true
