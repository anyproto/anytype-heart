  /v2/spaces/{space_id}/types:
    get:
      operationId: list_types
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse-TypeRow'
          description: Type rows
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Space not found or unavailable
      security:
      - bearerauth: []
      summary: List the types in a space
      tags:
      - Types
    post:
      description: A `type_settings.property_definitions` entry naming a property
        that does not exist creates it alongside the type. The body is an AnyBlock
        document with kind "object_type"; the type's api key, layout and plural name
        live in `type_settings`.
      operationId: create_type
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Validate and report without committing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: 'Create select options for names the property does not hold yet
          (default false: an unmatched name is refused)'
        in: query
        name: create_missing_options
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
          description: Dry run; validation result without committing
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
          description: Created type id + key
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation failure
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Create a type
      tags:
      - Types
  /v2/spaces/{space_id}/types/{type}:
    delete:
      operationId: delete_type
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Type key
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
          description: Archived type
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No live type with this key. A type that is already deleted
            is a 404 too, not a second delete.
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Delete a type
      tags:
      - Types
    get:
      operationId: get_type
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Type key
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: compact (default) is the edit shape, with short labels for minted
          view and block ids; full is the export shape, with full ids
        in: query
        name: ids
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: The kind:objectType AnyBlock document + etag
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Type not found
      security:
      - bearerauth: []
      summary: Read a type as an AnyBlock document
      tags:
      - Types
    patch:
      description: '`type_settings.property_definitions`, when present, replaces the
        recommended property lists rather than adding to them, and creates any property
        that does not exist yet. `properties` takes name and description; the layout
        is `type_settings.layout` and the icon is the typed envelope `icon`. Any other
        key is refused.'
      operationId: update_type
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Type key
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
          description: Updated type
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Type not found
        "409":
          $ref: '#/components/responses/Conflict'
        "413":
          $ref: '#/components/responses/RequestTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Update a type
      tags:
      - Types
  /v2/spaces/{space_id}/types/{type}/schema:
    get:
      description: Not implemented. Every request answers 501.
      operationId: get_type_schema
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Type key
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not implemented yet
      security:
      - bearerauth: []
      summary: Get a JSON Schema for a type
      tags:
      - Types
  /v2/validate:
    post:
      description: 'Structure and format rules only. Nothing is resolved against a
        space, so option names and a type''s property keys are not checked here. Findings
        come back as data: an invalid document is still a 200, carrying the issues,
        and a valid one carries empty lists.'
      operationId: validate
      parameters:
      - description: Retry key; identical requests replay, different requests conflict
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
          description: Issue and warning lists, empty when the document is valid
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
      security:
      - bearerauth: []
      summary: Validate an AnyBlock document
      tags:
      - Schemas
servers:
- url: http://127.0.0.1:31009
tags:
- description: What the calling key may do. Ask this before discovering the limits
    through 403s.
  name: Auth
- description: The containers everything else lives in. Nearly every other route is
    scoped to one.
  name: Spaces
- description: 'Read and write whole AnyBlock documents: one GET returns an editable
    document, one PATCH edits it.'
  name: Objects
- description: Find objects by query, filter and sort, within one space or across
    all of them.
  name: Search
- description: 'An object''s shape: the properties it recommends and the views it
    opens with.'
  name: Types
- description: The typed key-value fields objects carry, and the option vocabularies
    select fields draw from.
  name: Properties
- description: Sets (a live query over a type) and collections (a hand-curated list),
    with their views.
  name: Lists
- description: Messages, reactions and read state. Chats store messages outside blocks,
    paged by order-id cursors.
  name: Chat
- description: Who is in a space, and which of them you are.
  name: Members
- description: Upload bytes and get the id that file blocks and chat attachments reference.
  name: Files
- description: Starting documents for a type.
  name: Templates
- description: 'The format itself: what a valid document looks like, what each PATCH
    op accepts, and a validator to check one against them. Read these before writing.'
  name: Schemas
