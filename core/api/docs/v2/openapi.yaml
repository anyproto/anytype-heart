        in: query
        name: width
        schema:
          minimum: 0
          type: integer
      - description: Byte range
        in: header
        name: Range
        schema:
          type: string
      - description: Previously received ETag
        in: header
        name: If-None-Match
        schema:
          type: string
      - description: ETag or modification date for a range request
        in: header
        name: If-Range
        schema:
          type: string
      responses:
        "200":
          content:
