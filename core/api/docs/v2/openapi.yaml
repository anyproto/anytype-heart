        "429":
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerauth: []
      summary: Delete an object this key created
      tags:
      - Objects
    get:
      description: A `block` subtree comes back flagged as a subtree, and no write
        path accepts that partial body. `format=md` is read-only; markdown cannot
        be sent back.
      operationId: get_object
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Object id
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: Subset of properties,blocks (default both)
        in: query
        name: include
        schema:
          type: string
      - description: 'Return the outline instead of full blocks: every block''s indent/id/type
          plus its text truncated to 80 runes'
        in: query
        name: outline
        schema:
          type: boolean
      - description: Return only this block's subtree
        in: query
        name: block
        schema:
          type: string
      - description: compact (default) is the edit shape, where minted block ids relabel
          to short suffixes; full is the export shape, with full ids everywhere, and
          the shape to send back. Object references are full and inline in both.
        in: query
        name: ids
        schema:
          type: string
      - description: anyblock (default) or md
        in: query
        name: format
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: The flat AnyBlock document + etag
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Illegal parameter combination (ambiguous_input)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object or space not found
      security:
      - bearerauth: []
      summary: Read an object as an AnyBlock document
      tags:
      - Objects
    patch:
      description: Ops apply in order as one change set. If one fails, or the result
        breaks the format's rules, none of them land. `update_block`, `delete_block`
        and `replace_text` can address a block by its exact text instead of an id;
