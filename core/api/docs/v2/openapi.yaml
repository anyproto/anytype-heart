    get:
      description: '`after` on its own walks forward, oldest first, continuing from
        `next_after`. Every other query, including `after` together with `before`,
        is anchored at the newest end of the range and walks backward from `next_before`.
        Both bounds are exclusive. `message_count` is the chat''s total since it began,
        not the size of the range. Offset paging does not apply here, and `offset`
        is refused.'
      operationId: get_chat_messages
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Chat object id
        in: path
        name: chat_id
        required: true
        schema:
          type: string
      - description: Return messages after this order id (exclusive)
        in: query
        name: after
        schema:
          type: string
      - description: Return messages before this order id (exclusive)
        in: query
        name: before
        schema:
          type: string
      - description: Messages to return
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: counts (default) returns the emoji counts; full adds the participant
          ids behind each count
        in: query
        name: reactions
        schema:
          type: string
