components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Invalid path, query or request input
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
      description: Missing, unknown, revoked or expired key; shared authentication envelope
    Forbidden:
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ForbiddenError'
            - $ref: '#/components/schemas/Error'
      description: The shared key-scope gate uses the legacy envelope; an operation-specific refusal may use the v2 error envelope
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Idempotency-Key conflict, or an operation-specific concurrency conflict
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The space does not exist, or is not available (deleted, left, or still joining)
    RequestTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request body exceeds this operation's documented cap
    RateLimited:
      content:
        application/json:
          schema:
            properties:
              code:
                example: rate_limit_exceeded
                type: string
              message:
                example: Rate limit exceeded
                type: string
              object:
                example: error
                type: string
              status:
                example: 429
                type: integer
            type: object
      description: Shared write rate limit; legacy error envelope
  schemas:
    AnyValue:
      oneOf:
        - maxLength: 1048576
          type: string
        - type: number
        - type: boolean
        - type: "null"
        - items:
            oneOf:
              - maxLength: 1048576
                type: string
              - type: number
              - type: boolean
              - type: "null"
              - items:
                  oneOf:
                    - maxLength: 1048576
                      type: string
                    - type: number
                    - type: boolean
                    - type: "null"
                    - items:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxItems: 2048
                      type: array
                    - additionalProperties:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxProperties: 128
                      type: object
                maxItems: 2048
                type: array
              - additionalProperties:
                  oneOf:
                    - maxLength: 1048576
                      type: string
                    - type: number
                    - type: boolean
                    - type: "null"
                    - items:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxItems: 2048
                      type: array
                    - additionalProperties:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxProperties: 128
                      type: object
                maxProperties: 128
                type: object
          maxItems: 2048
          type: array
        - additionalProperties:
            oneOf:
              - maxLength: 1048576
                type: string
              - type: number
              - type: boolean
              - type: "null"
              - items:
                  oneOf:
                    - maxLength: 1048576
                      type: string
                    - type: number
                    - type: boolean
                    - type: "null"
                    - items:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxItems: 2048
                      type: array
                    - additionalProperties:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxProperties: 128
                      type: object
                maxItems: 2048
                type: array
              - additionalProperties:
                  oneOf:
                    - maxLength: 1048576
                      type: string
                    - type: number
                    - type: boolean
                    - type: "null"
                    - items:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxItems: 2048
                      type: array
                    - additionalProperties:
                        oneOf:
                          - maxLength: 1048576
                            type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      maxProperties: 128
                      type: object
                maxProperties: 128
                type: object
          maxProperties: 128
          type: object
    FilterNode:
      oneOf:
        - additionalProperties: false
          properties:
            filters:
              items:
                $ref: '#/components/schemas/FilterNode'
              maxItems: 50
              minItems: 1
              type: array
            operator:
              enum:
                - and
                - or
              type: string
          required:
            - operator
            - filters
          type: object
        - additionalProperties: false
          properties:
            condition:
              enum:
                - equal
                - not_equal
                - greater
                - less
                - greater_or_equal
                - less_or_equal
                - contains
                - not_contains
                - in
                - not_in
                - empty
                - not_empty
                - all_in
                - not_all_in
                - exact_in
                - not_exact_in
                - exists
              type: string
            date_preset:
              enum:
                - yesterday
                - today
                - tomorrow
                - last_week
                - current_week
                - next_week
                - last_month
                - current_month
                - next_month
                - number_of_days_ago
                - number_of_days_now
                - last_year
                - current_year
                - next_year
              type: string
            include_time:
              type: boolean
            property:
              maxLength: 256
              type: string
            value:
              description: leaf value. A select or multi_select takes option names, never ids. A date takes unix seconds; where the filter is stored (a query's views, update_view) it also takes a date string such as 2026-08-01 or 2026-08-01T09:00:00Z, converted on write, while search takes a date string only in the compact filter string
          required:
            - property
            - condition
          type: object
    ValidationError:
      properties:
        code:
          example: bad_request
          type: string
        message:
          example: Bad request
          type: string
        object:
          example: error
          type: string
        status:
          example: 400
          type: integer
      type: object
    ServerError:
      properties:
        code:
          example: internal_server_error
          type: string
        message:
          example: Internal server error
          type: string
        object:
          example: error
          type: string
        status:
          example: 500
          type: integer
      type: object
    ForbiddenError:
      properties:
        code:
          example: forbidden
          type: string
        message:
          example: Forbidden
          type: string
        object:
          example: error
          type: string
        status:
          example: 403
          type: integer
      required:
      - object
      - status
      - code
      - message
      type: object
    CreateChallengeResponse:
      properties:
        challenge_id:
          description: The challenge id associated with the displayed code and needed
            to solve the challenge for api_key
          example: GB6ZU3Y52UGUEQQCIJC33LM6XC
          type: string
      type: object
    CreateChallengeRequest:
      properties:
        app_name:
          description: The name of the app that is requesting the challenge
          example: anytype_mcp
          type: string
      type: object
    CreateApiKeyResponse:
      required: [api_key, grant]
      properties:
        api_key:
          description: |-
            ApiKey is an opaque bearer key in the format `anytype_<body>_<checksum>`.
            New keys match `\banytype_[0-9A-Za-z]{40,60}_[0-9a-f]{8}\b`; the body
            length varies. Previously issued unprefixed base64 keys remain valid.
          example: anytype_amfbcga7eywtio2cjfifoxtfnrzxvamir6lj3jflwk44br6o2xoa_3fe1d4b7
          type: string
        grant:
          $ref: '#/components/schemas/ApiKeyGrant'
      type: object
    CreateApiKeyRequest:
      properties:
        challenge_id:
          description: The challenge id associated with the previously displayed code
          example: GB6ZU3Y52UGUEQQCIJC33LM6XC
          type: string
        code:
          description: The 4-digit code retrieved from Anytype Desktop app
          example: "1234"
          type: string
      type: object
    ApiKeyGrant:
      required: [all_spaces, space_ids, permission]
      description: The grant approved by the user and persisted with this key; null
        for an unscoped key.
      properties:
        all_spaces:
          description: Covers all current and future user spaces when true; space_ids
            is then empty.
          type: boolean
        permission:
          description: The access approved by the user, which may differ from what
            the app requested.
          enum:
          - read
          - readwrite
          type: string
        space_ids:
          description: Full IDs of the granted spaces. An empty list alone never means
            all spaces.
          items:
            type: string
          type: array
          uniqueItems: false
      type: [object, 'null']
    UnauthorizedError:
      properties:
        code:
          example: unauthorized
          type: string
        message:
          example: Unauthorized
          type: string
        object:
          example: error
          type: string
        status:
          example: 401
          type: integer
      required:
      - object
      - status
      - code
      - message
      type: object
    AddChatMessageRequest:
      properties:
        attachments:
          items:
            type: string
          type: array
          uniqueItems: false
        reply_to:
          type: string
        text:
          type: string
      type: object
    AppliedTemplate:
      description: The template the new object started from, absent when it started
        from nothing.
      properties:
        blocks_added:
          description: 'How many blocks the template carried, counted before the object''s
            layout runs and without its header: the title, description and featured
            properties every object carries. Absent on a dry run, which does not build
            the template, and zero is a real answer.'
          type: integer
        combined:
          description: True when this request sent blocks of its own, which follow
            the template's in the object.
          type: boolean
        id:
          description: Store id of the template.
          type: string
        name:
          description: Display name of the template, empty when it has none.
          type: string
        source:
          description: 'Who chose it: request when the create named it, type_default
            when the type''s default_template did.'
          type: string
      type: object
    ChatAttachment:
      properties:
        id:
          type: string
        type:
          type: string
      type: object
    ChatMessage:
      properties:
        at:
          type: string
        attachments:
          items:
            $ref: '#/components/schemas/ChatAttachment'
          type: array
          uniqueItems: false
        author:
          type: string
        author_id:
          type: string
        blocks_text:
          type: string
        edited_at:
          type: string
        id:
          type: string
        order:
          type: string
        pinned:
          type: boolean
        reacted_by:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        reactions:
          additionalProperties:
            type: integer
          type: object
        reply_to:
          type: string
        text:
          type: string
      type: object
    ChatMessageResult:
      properties:
        dry_run:
          type: boolean
        id:
          type: string
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ChatMessagesResponse:
      properties:
        has_more:
          description: more messages inside the requested bounds, not in the chat
            as a whole
          type: boolean
        lifetime_message_count:
          description: Messages ever posted, deleted ones included
          type: integer
        message_count:
          description: Messages the chat holds now; a deleted message leaves it
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          uniqueItems: false
        next_after:
          type: string
        next_before:
          type: string
        state:
          $ref: '#/components/schemas/ChatState'
      type: object
    ChatReactionRequest:
      properties:
        emoji:
          type: string
      type: object
    ChatReactionResult:
      properties:
        added:
          type: boolean
        dry_run:
          type: boolean
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ChatReadRequest:
      properties:
        last_state_id:
          type: string
        scope:
          type: string
        up_to:
          type: string
      type: object
    ChatReadResult:
      properties:
        dry_run:
          type: boolean
        state:
          $ref: '#/components/schemas/ChatState'
      type: object
    ChatResult:
      properties:
        dry_run:
          type: boolean
        id:
          type: string
        name:
          type: string
      type: object
    ChatRow:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    ChatState:
      properties:
        last_state_id:
          type: string
        oldest_unread_mention_order:
          type: string
        oldest_unread_order:
          type: string
        unread_mentions:
          type: integer
        unread_messages:
          type: integer
        unread_reaction_order:
          type: string
      type: object
    ChatStatusResult:
      properties:
        dry_run:
          type: boolean
      type: object
    CreateChatRequest:
      properties:
        name:
          type: string
      type: object
    CreateResult:
      properties:
        created:
          $ref: '#/components/schemas/SideEffects'
        created_views:
          additionalProperties:
            type: string
          description: The view id each insert_view op minted, keyed by the op's position,
            such as /ops/0.
          type: object
        dry_run:
          type: boolean
        etag:
          description: etag of the created object
          type: string
        id:
          type: string
        issues:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
        items:
          description: Count of the member objects a created collection holds, on
            every collection create
          type: integer
        key:
          description: identity key (types, properties)
          type: string
        removed:
          $ref: '#/components/schemas/SideEffects'
        template:
          $ref: '#/components/schemas/AppliedTemplate'
        type:
          description: type key of the created object
          type: string
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    CreateSpaceRequest:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    CreatedOption:
      properties:
        name:
          type: string
        property:
          description: property key
          type: string
      type: object
    DiffStats:
      properties:
        blocks_added:
          type: integer
        blocks_changed:
          type: integer
        blocks_moved:
          type: integer
        blocks_removed:
          type: integer
        items_added:
          description: Collection members the batch added, as a set difference; absent
            means none
          type: integer
        items_removed:
          description: Collection members the batch removed, as a set difference;
            absent means none
          type: integer
        properties_changed:
          type: integer
      type: object
    DiscussionResult:
      properties:
        created:
          type: boolean
        dry_run:
          type: boolean
        id:
          type: string
      type: object
    EditChatMessageRequest:
      properties:
        text:
          type: string
      type: object
    EditResult:
      properties:
        created:
          $ref: '#/components/schemas/SideEffects'
        created_blocks:
          additionalProperties:
            type: string
          description: |-
            Maps payload positions to new block IDs, including nested table rows,
            columns, and cell descendants (e.g. "ops[3].blocks[0].rows[1]").
            Existing IDs are omitted. Values match the resulting document:
            compact by default, full with ?ids=full. IDs absent from that document
            retain their minted spelling.
          type: object
        created_views:
          additionalProperties:
            type: string
          description: |-
            Maps payload positions to new view IDs: "ops[i]" for insert_view or
            "ops[i].set.views[j]" for update_block. Values match the resulting
            document and view listing: compact by default, full with ?ids=full.
            IDs absent from the document retain their minted spelling.
          type: object
        diff_stats:
          $ref: '#/components/schemas/DiffStats'
        dry_run:
          type: boolean
        etag:
          type: string
        type_changed:
          $ref: '#/components/schemas/TypeChange'
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    Error:
      properties:
        code:
          type: string
        issues:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
        message:
          type: string
        status:
          type: integer
      required:
      - status
      - code
      - message
      - issues
      type: object
    FileUploadResult:
      properties:
        dry_run:
          type: boolean
        id:
          type: string
        mime_type:
          type: string
        name:
          type: string
        size:
          type: integer
      type: object
    Issue:
      properties:
        hint:
          type: string
        message:
          type: string
        path:
          type: string
        see_also:
          description: 'The operations the hint names, as data: each renders in the
            hint as its method and path with params substituted and `?k=v` query sorted
            by key, so a caller with tools instead of routes can find and replace
            it by op.'
          items:
            $ref: '#/components/schemas/Ref'
          type: array
          uniqueItems: false
      required:
      - message
      type: object
    ListResponse-ChatRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ChatRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-MemberRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MemberRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-ObjectRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ObjectRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-OptionRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/OptionRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-PropertyRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PropertyRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-TemplateRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TemplateRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-TypeRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TypeRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-ViewObject:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ViewObject'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListResponse-WidgetRow:
      properties:
        data:
          items:
            $ref: '#/components/schemas/WidgetRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ListSpacesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SpaceRow'
          type: array
          uniqueItems: false
        has_more:
          type: boolean
        has_not_granted_spaces:
          description: True when other live user spaces are excluded by this key's
            grant, independently of the requested page. Ask the user to grant access
            if a requested space is missing.
          type: boolean
        limit:
          type: integer
        message:
          type: string
        offset:
          type: integer
        total:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      required:
      - data
      - total
      - offset
      - limit
      - has_more
      - has_not_granted_spaces
      type: object
    MemberRow:
      properties:
        icon_image:
          description: Icon id; download with GET /v2/spaces/{space_id}/files/{file_id}/content.
          type: string
        id:
          type: string
        identity:
          type: string
        name:
          type: string
        role:
          type: string
      type: object
    ObjectRow:
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          additionalProperties: {}
          type: object
        space_id:
          type: string
        type:
          type: string
      type: object
    OptionRow:
      properties:
        color:
          type: string
        name:
          type: string
      type: object
    PropertyRow:
      properties:
        format:
          type: string
        key:
          type: string
        name:
          type: string
      type: object
    Ref:
      properties:
        op:
          description: The operation's OpenAPI operationId, such as list_properties;
            absent means the request that produced this issue, resent with the query
            given, and the hint then spells only the query.
          type: string
        params:
          additionalProperties:
            type: string
          description: Path parameters by their OpenAPI name, each substituted into
            the path once and verbatim (no percent-encoding); one left out keeps its
            {name} placeholder in the hint for the caller to fill.
          type: object
        query:
          additionalProperties:
            type: string
          description: Query parameters to send with the operation, spelled in the
            hint as ?name=value pairs joined by & and sorted by name, values verbatim.
          type: object
      type: object
    SchemaEntry:
      properties:
        endpoint:
          type: string
        example:
          type: object
        example_body:
          description: An op schema's example wrapped as the request body it is sent
            in
          type: object
        grammar:
          type: string
        grammar_examples:
          items:
            type: string
          type: array
          uniqueItems: false
        kind:
          type: string
        schema:
          type: object
      type: object
    SchemaIndex:
      properties:
        kinds:
          items:
            $ref: '#/components/schemas/SchemaIndexEntry'
          type: array
          uniqueItems: false
        ops:
          items:
            $ref: '#/components/schemas/SchemaIndexEntry'
