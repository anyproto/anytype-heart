  /v2/spaces/{space_id}/chats/{chat_id}/status:
    post:
      description: Publishes encrypted ephemeral JSON on <chat_id>/status. Empty text
        is omitted so clients can show localized typing. data accepts any JSON value.
        The encoded payload is limited to 65,508 bytes. Status is not stored or replayed;
        receivers expire it. Success acknowledges acceptance, not delivery.
      operationId: publish_chat_status
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Chat or discussion id
        in: path
        name: chat_id
        required: true
        schema:
          type: string
      - description: Validate without publishing
        in: query
        name: dry_run
        schema:
          type: boolean
      - description: Unique key for this update; a reused key replays the response
          without publishing again
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: ephemeral activity; the encoded JSON payload must fit in 65508 bytes, including field names and escaping
              properties:
                data:
                  description: 'optional arbitrary JSON value: object, array, string, number, boolean or null'
                text:
                  description: optional display text; empty or omitted is left out of the pubsub payload so receivers can show a localized typing label; JSON escaping and data consume the same byte budget
                  maxLength: 65497
                  type: string
              type: object
        description: Optional text and arbitrary JSON data; clients localize the default
          typing label
      responses:
        "200":
          content:
            application/json:
              schema:
