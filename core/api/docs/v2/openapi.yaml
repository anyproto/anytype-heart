components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Invalid path, query or request input
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
      description: Missing, unknown, revoked or expired key; shared authentication envelope
    Forbidden:
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ForbiddenError'
            - $ref: '#/components/schemas/Error'
      description: The shared key-scope gate uses the legacy envelope; an operation-specific refusal may use the v2 error envelope
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Idempotency-Key conflict, or an operation-specific concurrency conflict
    RequestTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request body exceeds this operation's documented cap
    RateLimited:
      content:
        application/json:
          schema:
            properties:
              code:
                example: rate_limit_exceeded
                type: string
              message:
                example: Rate limit exceeded
                type: string
              object:
                example: error
                type: string
              status:
                example: 429
                type: integer
            type: object
      description: Shared write rate limit; legacy error envelope
  schemas:
    ForbiddenError:
      properties:
        code:
          example: forbidden
          type: string
        message:
          example: Forbidden
          type: string
        object:
          example: error
          type: string
        status:
          example: 403
          type: integer
      type: object
    UnauthorizedError:
      properties:
        code:
          example: unauthorized
          type: string
        message:
          example: Unauthorized
          type: string
        object:
          example: error
          type: string
        status:
          example: 401
          type: integer
      type: object
    AddChatMessageRequest:
      properties:
        attachments:
          items:
            type: string
          type: array
          uniqueItems: false
        reply_to:
          type: string
        text:
          type: string
      type: object
    ChatAttachment:
      properties:
        id:
          type: string
        type:
          type: string
      type: object
    ChatMessage:
      properties:
        at:
          type: string
        attachments:
          items:
            $ref: '#/components/schemas/ChatAttachment'
          type: array
          uniqueItems: false
        author:
          type: string
        author_id:
          type: string
        blocks_text:
          type: string
        edited_at:
          type: string
        id:
          type: string
        order:
          type: string
        pinned:
          type: boolean
        reacted_by:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        reactions:
          additionalProperties:
            type: integer
          type: object
        reply_to:
          type: string
        text:
          type: string
      type: object
    ChatMessageResult:
      properties:
        dry_run:
          type: boolean
        id:
          type: string
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          uniqueItems: false
      type: object
    ChatMessagesResponse:
      properties:
        has_more:
          description: more messages inside the requested bounds, not in the chat
            as a whole
          type: boolean
        message_count:
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          uniqueItems: false
        next_after:
          type: string
        next_before:
          type: string
        state:
