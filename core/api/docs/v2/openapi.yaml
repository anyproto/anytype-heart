        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Object, space, or referenced block not found
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          content:
