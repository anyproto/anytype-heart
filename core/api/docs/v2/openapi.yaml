  /v2/spaces/{space_id}/chats/{chat_id}/messages:
    get:
      description: "Cursor-paged messages (ascending order): ?after=/?before= are
        EXCLUSIVE order-id bounds, ?limit defaults to 25. A forward walk uses ?after
        alone and continues with the response's nextAfter; every OTHER query — ?before,
        no cursor, or BOTH bounds — is anchored at its NEWEST end (the newest N in
        range) and pages backward with nextBefore, so after+before does NOT walk forward
        through the window. has_more says more messages exist inside the requested
        bounds. The response carries state (unread counters, oldest unread orders,
        lastStateId — the mark-read race guard) and messageCount (the chat's LIFETIME
        total, not the range size) at zero extra cost; a poll is a limit=1 read. Message
        text is §8 inline markup (blocksText carries block-composed content read-only);
        reactions is always emoji counts ({\"\U0001F44D\":2}); ?reactions=full adds
        reactedBy (participant-id lists) in its own slot. Offset pagination does not
        apply — page with the cursors."
      operationId: v2_get_chat_messages
      parameters:
      - description: Space id
        in: path
        name: space_id
        required: true
        schema:
          type: string
      - description: Chat object id
        in: path
        name: chat_id
        required: true
        schema:
          type: string
      - description: Return messages after this order id (exclusive)
        in: query
        name: after
        schema:
          type: string
      - description: Return messages before this order id (exclusive)
        in: query
        name: before
        schema:
          type: string
      - description: Messages to return
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: counts (default) | full
        in: query
        name: reactions
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
          description: Messages + state + messageCount
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not a chat, or invalid params
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Chat not found
      security:
      - bearerauth: []
      summary: Get chat messages
      tags:
      - V2
    post:
      description: 'Sends one message: {text, replyTo?, attachments?}. Text is §8
        markup SOURCE — *, [, ` and <mention objectId="…"> syntax mint real marks
        (the D′1 caveat; escape literal specials with a backslash) — capped at 8000
        UTF-16 code units (an emoji counts 2+). Attachments are bare object ids, at
        most 32; the kind is inferred from each target''s layout (image → image, other
        file layouts → file, anything else → link). Honors Idempotency-Key (C8 — a
        double-sent chat message is user-visible damage) and ?dry_run=true (C9, validate-only).'
      operationId: v2_add_chat_message
      parameters:
