components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Invalid path, query or request input
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
      description: Missing, unknown, revoked or expired key; shared authentication envelope
    Forbidden:
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ForbiddenError'
            - $ref: '#/components/schemas/Error'
      description: The shared key-scope gate uses the legacy envelope; an operation-specific refusal may use the v2 error envelope
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Idempotency-Key conflict, or an operation-specific concurrency conflict
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The space does not exist, or is not available (deleted, left, or still joining)
    RequestTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request body exceeds this operation's documented cap
    RateLimited:
      content:
        application/json:
          schema:
            properties:
              code:
                example: rate_limit_exceeded
                type: string
              message:
                example: Rate limit exceeded
                type: string
              object:
                example: error
                type: string
              status:
                example: 429
                type: integer
            type: object
      description: Shared write rate limit; legacy error envelope
  schemas:
    ValidationError:
      properties:
        code:
          example: bad_request
          type: string
        message:
          example: Bad request
          type: string
        object:
          example: error
          type: string
        status:
          example: 400
          type: integer
      type: object
    ServerError:
      properties:
        code:
          example: internal_server_error
          type: string
        message:
          example: Internal server error
          type: string
        object:
          example: error
          type: string
        status:
          example: 500
          type: integer
      type: object
    ForbiddenError:
      properties:
        code:
          example: forbidden
          type: string
        message:
          example: Forbidden
          type: string
        object:
          example: error
          type: string
        status:
          example: 403
          type: integer
      required:
      - object
      - status
      - code
      - message
      type: object
    CreateChallengeResponse:
      properties:
        challenge_id:
          description: The challenge id associated with the displayed code and needed
            to solve the challenge for api_key
          example: 67647f5ecda913e9a2e11b26
          type: string
      type: object
    CreateChallengeRequest:
      properties:
        app_name:
          description: The name of the app that is requesting the challenge
          example: anytype_mcp
          type: string
      type: object
    CreateApiKeyResponse:
      required: [api_key, grant]
      properties:
        api_key:
          description: |-
            ApiKey is an opaque bearer key in the format `anytype_<body>_<checksum>`.
            New keys match `\banytype_[0-9A-Za-z]{40,60}_[0-9a-f]{8}\b`; the body
            length varies. Previously issued unprefixed base64 keys remain valid.
          example: anytype_amfbcga7eywtio2cjfifoxtfnrzxvamir6lj3jflwk44br6o2xoa_3fe1d4b7
          type: string
        grant:
          $ref: '#/components/schemas/ApiKeyGrant'
      type: object
    CreateApiKeyRequest:
      properties:
        challenge_id:
          description: The challenge id associated with the previously displayed code
          example: 67647f5ecda913e9a2e11b26
          type: string
        code:
          description: The 4-digit code retrieved from Anytype Desktop app
          example: "1234"
          type: string
      type: object
    ApiKeyGrant:
      required: [all_spaces, space_ids, permission]
      description: The grant approved by the user and persisted with this key; null
        for an unscoped key.
      properties:
        all_spaces:
          description: Covers all current and future user spaces when true; space_ids
            is then empty.
          type: boolean
        permission:
          description: The access approved by the user, which may differ from what
            the app requested.
          enum:
          - read
          - readwrite
          type: string
        space_ids:
          description: Full IDs of the granted spaces. An empty list alone never means
            all spaces.
          items:
            type: string
          type: array
          uniqueItems: false
      type: [object, 'null']
    UnauthorizedError:
      properties:
        code:
          example: unauthorized
          type: string
        message:
          example: Unauthorized
          type: string
        object:
          example: error
          type: string
        status:
          example: 401
          type: integer
      required:
      - object
      - status
      - code
      - message
      type: object
    AddChatMessageRequest:
      properties:
        attachments:
          items:
            type: string
          type: array
          uniqueItems: false
        reply_to:
          type: string
        text:
          type: string
      type: object
    ChatAttachment:
      properties:
        id:
          type: string
        type:
          type: string
      type: object
    ChatMessage:
      properties:
        at:
          type: string
        attachments:
