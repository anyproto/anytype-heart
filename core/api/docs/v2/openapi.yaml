          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditResult'
          description: New etag + created block ids + diff_stats
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid ops or post-op document
        "401":
