name: Build

# The platforms build in parallel jobs, on a runner of their OS where that saves a cross toolchain:
# the darwin servers and, cross-compiled with Homebrew's MinGW, the windows server in one macOS job
# (MinGW is the toolchain the tantivy library is built with, linking the Universal C Runtime;
# Ubuntu's MinGW links msvcrt.dll instead); iOS in another (Xcode); linux natively on Linux (amd64
# and arm64, both with musl); and Android on x86_64 Linux (the NDK has no Linux arm64 host build).
# The protos are generated once, on macOS for the Swift plugin. The release job
# packs the archives, publishes the libraries to Maven and makes the GitHub release only once every
# build has succeeded.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      alpha_version:
        description: 'Alpha version'
        default: ''
      run-on-runner:
        description: 'Runner for the macOS jobs (darwin, iOS, protos)'
        required: true
        default: 'macos-15'
      publish-maven:
        description: 'Publish the iOS and Android libraries to Maven'
        type: boolean
        default: true

permissions:
  actions: 'write'
  packages: 'write'
  contents: 'write'

jobs:
  protos:
    runs-on: ${{ github.event_name == 'push' && 'macos-15' || inputs.run-on-runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protoc and the Swift plugin
        run: HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install protobuf swift-protobuf

      - name: Generate the JS, Swift and Java protos
        run: |
          # In the order the single-job build ran them: json/ accumulates, so the Swift and the
          # Java archives also carry relations.json
          mkdir -p out/js out/swift out/java
          make protos-js ci-js-protos
          cp -R protobuf json out/js/
          make swift-protos
          cp -R protobuf json out/swift/
          make ci-java-protos
          cp -R protobuf json out/java/
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -cf protos.tar -C out js swift java

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: protos
          path: protos.tar
          retention-days: 7

  server:
    name: server ${{ matrix.name }}
    runs-on: ${{ matrix.runner == 'macos' && (github.event_name == 'push' && 'macos-15' || inputs.run-on-runner || 'macos-15') || matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds its three targets one after another: together they take about as
          # long as the iOS job, and it leaves macOS runners (a cap shared across the organization)
          # for other jobs. Not with make -j: on the 3-core runner parallel builds starve each other.
          - name: macos
            runner: macos
            targets: darwin-amd64 darwin-arm64 windows-amd64
          - name: linux-amd64
            runner: ubuntu-24.04
            targets: linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            targets: linux-arm64
    env:
      TARGETS: ${{ matrix.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.2'

      - name: Install the MinGW toolchain
        if: contains(matrix.targets, 'windows-amd64')
        run: HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install mingw-w64

      - name: Setup
        uses: ./.github/actions/release-build-setup
        with:
          unsplash-key: ${{ secrets.UNSPLASH_KEY }}
          inhouse-key: ${{ secrets.INHOUSE_KEY }}
          anytype-pat: ${{ secrets.ANYTYPE_PAT }}

      - name: Build
        if: runner.os == 'macOS'
        run: |
          for target in $TARGETS; do
            echo "::group::$target"
            make cross-compile-library-$target
            echo "::endgroup::"
          done

      # Linux builds with musl inside Alpine, whose GCC is built for musl. Ubuntu's musl-gcc wraps
      # the glibc GCC, and a static link then takes its libgcc_eh, which calls glibc's
      # _dl_find_object. Only the build runs in the container (JavaScript actions don't run in
      # Alpine on arm64): it uses the host's Go, whose binaries are static, and module cache.
      - name: Build in Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$(go env GOROOT):/opt/go:ro" \
            -v "$(go env GOMODCACHE):/root/go/pkg/mod" \
            -e FLAGS -e BUILD_TAG_NETWORK -e GOPRIVATE -e TARGETS -e GOTOOLCHAIN=local \
            alpine:3.22 sh -euc '
              apk add --no-cache build-base git make >/dev/null
              git config --global --add safe.directory /src
              # The Makefile calls the compiler by its musl-cross name, <arch>-linux-musl-gcc
              ln -s "$(command -v gcc)" "/usr/local/bin/$(uname -m)-linux-musl-gcc"
              export PATH=/opt/go/bin:$PATH
              for target in $TARGETS; do make cross-compile-library-$target; done'

      - name: Check the binaries
        run: |
          for target in $TARGETS; do
            file $target
            # A linux server linked dynamically against musl doesn't start on glibc distributions
            if [[ $target == linux-* ]] && ! file $target | grep -q 'statically linked'; then
              echo "::error::$target is not statically linked"
              exit 1
            fi
            # The windows server uses the Universal C Runtime (api-ms-win-crt-*), like the tantivy
            # library it links; a MinGW that defaults to msvcrt.dll would mix the two runtimes
            if [[ $target == windows-* ]]; then
              x86_64-w64-mingw32-objdump -p $target | grep 'DLL Name' | sort -u
              if x86_64-w64-mingw32-objdump -p $target | grep -qi 'DLL Name: msvcrt.dll'; then
                echo "::error::$target imports msvcrt.dll instead of the Universal C Runtime"
                exit 1
              fi
            fi
          done

      - name: Bundle
        run: |
          for target in $TARGETS; do
            tar -cf server-$target.tar $target
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.name }}
          path: server-*.tar
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: ${{ github.event_name == 'push' && 'macos-15' || inputs.run-on-runner || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.2'

      - name: Setup
        uses: ./.github/actions/release-build-setup
        with:
          unsplash-key: ${{ secrets.UNSPLASH_KEY }}
          inhouse-key: ${{ secrets.INHOUSE_KEY }}
          anytype-pat: ${{ secrets.ANYTYPE_PAT }}

      - name: Setup gomobile
        run: make setup-gomobile

      - name: Build
        run: make build-ios-lib

      - name: Bundle
        run: COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -cf ios.tar Lib.xcframework

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ios.tar
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/release-build-setup
        with:
          unsplash-key: ${{ secrets.UNSPLASH_KEY }}
          inhouse-key: ${{ secrets.INHOUSE_KEY }}
          anytype-pat: ${{ secrets.ANYTYPE_PAT }}

      - name: Use NDK 28
        run: |
          # The Ubuntu image ships NDK 27, 29 and 30; install the 28 the macOS image had
          if ! ls -d ${ANDROID_HOME}/ndk/28.* >/dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          fi
          NDK28=$(ls -d ${ANDROID_HOME}/ndk/28.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK28" ]; then echo "::error::NDK 28.x not found"; ls ${ANDROID_HOME}/ndk/; exit 1; fi
          echo "Using NDK: $NDK28"
          echo ANDROID_NDK=$NDK28 >> $GITHUB_ENV
          echo ANDROID_NDK_HOME=$NDK28 >> $GITHUB_ENV
          echo ANDROID_NDK_ROOT=$NDK28 >> $GITHUB_ENV

      - name: Setup gomobile
        run: make setup-gomobile

      - name: Build
        run: make build-android-lib

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: lib.aar
          retention-days: 7

  release:
    needs: [protos, server, ios, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/release-build-setup
        with:
          go: 'false'
          unsplash-key: ${{ secrets.UNSPLASH_KEY }}
          inhouse-key: ${{ secrets.INHOUSE_KEY }}
          anytype-pat: ${{ secrets.ANYTYPE_PAT }}

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack the release archives
        run: bash .github/scripts/pack-release.sh "$VERSION" artifacts .release

      - name: Validate release artifacts
        run: |
          expected=(
            ".release/android_lib_${VERSION}.tar.gz"
            ".release/ios_framework_${VERSION}.tar.gz"
            ".release/js_${VERSION}_darwin-amd64.tar.gz"
            ".release/js_${VERSION}_darwin-arm64.tar.gz"
            ".release/js_${VERSION}_linux-amd64.tar.gz"
            ".release/js_${VERSION}_linux-arm64.tar.gz"
            ".release/js_${VERSION}_windows-amd64.zip"
          )
          missing=()
          for f in "${expected[@]}"; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release blocked — missing artifacts:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All 7 release artifacts present:"
          ls -lh .release/

      - name: Upload the release archives of a manual run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Stage the Maven artifacts
        run: |
          cp ".release/ios_framework_${VERSION}.tar.gz" ios_framework.tar.gz
          cp artifacts/android/lib.aar lib.aar

      - name: Publish the iOS lib to Maven
        if: github.event_name == 'push' || inputs.publish-maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          MAVEN_ARTIFACT_ID: 'anytype-heart-ios'
          MAVEN_ARTIFACT_NAME: 'ios_framework.tar.gz'
        run: gradle publish

      - name: Publish the android lib to Maven
        if: github.event_name == 'push' || inputs.publish-maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          MAVEN_ARTIFACT_ID: 'anytype-heart-android'
          MAVEN_ARTIFACT_NAME: 'lib.aar'
        run: gradle publish

      - name: Check the Maven publications without publishing
        if: github.event_name != 'push' && !inputs.publish-maven
        run: |
          MAVEN_ARTIFACT_ID=anytype-heart-ios MAVEN_ARTIFACT_NAME=ios_framework.tar.gz gradle publishToMavenLocal
          MAVEN_ARTIFACT_ID=anytype-heart-android MAVEN_ARTIFACT_NAME=lib.aar gradle publishToMavenLocal

      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref, '-rc') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: '.release/*'

      - name: Trigger integration tests in anytype-suite
        if: github.event_name == 'push'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ANYTYPE_SUITE_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/anyproto/anytype-suite/dispatches \
            -d "{\"event_type\": \"test-release\", \"client_payload\": {\"version\": \"${{ env.VERSION }}\"}}"

      - name: Trigger release in anytype-cli
        if: github.event_name == 'push'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ANYTYPE_CLI_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/anyproto/anytype-cli/dispatches \
            -d "{\"event_type\": \"trigger-from-heart\", \"client_payload\": {\"version\": \"${{ env.VERSION }}\"}}"
