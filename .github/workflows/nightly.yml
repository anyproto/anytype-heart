name: Nightly Builds

on:
  workflow_dispatch:
    inputs:
      run-on-runner:
        description: 'Specify the runner to use'
        required: true
        default: 'macos-15'
        type: choice
        options:
          - macos-15
          - macos-14
      build-tag-network:
        description: 'Network config to use'
        required: true
        default: 'envproduction'
        type: choice
        options:
          - envproduction
          - envnetworkcustom
      run-diff-check:
        description: 'Run diff-check?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      nightly-base-version:
        description: 'Nightly builds base version (optional, format like "v1.2.3")'
        required: false
  schedule:
    - cron: '0 1 * * *' # every day at 1am (UTC)


permissions:
  actions: 'write'
  packages: 'write'
  contents: 'write'


jobs:
  diff-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force --prune
      - id: diff_check
        run: |
          if [[ "${{ github.event.inputs.run-diff-check || 'true' }}" == "true" ]]; then
            LAST_TAG=$(git describe --tags --match 'v*-nightly.*' --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              # no nightly tag found in history
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet "${LAST_TAG}..HEAD"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # when disabled explicitly: always set changed=true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: debug
        run: |
          echo "changed: ${{ steps.diff_check.outputs.changed }}"

  build:
    needs:
      - diff-check
    if: needs.diff-check.outputs.changed == 'true' # run only if there is a diff
    runs-on: ${{ github.event.inputs.run-on-runner || 'macos-15' }}
    outputs:
      body: ${{ steps.release_info.outputs.body }}
      html_url: ${{ steps.release_info.outputs.html_url }}
      tag_name: ${{ steps.release_info.outputs.tag_name }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Setup GO
        run: |
          echo "PATH=$PATH"
          echo "which go: '$(which go)'"
          echo "which go version: '$( $(which go) version )'"
          echo "go version: '$(go version)'"
          echo GOPATH=$(go env GOPATH) >> $GITHUB_ENV
          echo GOBIN=$(go env GOPATH)/bin >> $GITHUB_ENV
          echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install brew and node deps
        run: make install-brew-and-node-deps

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '16.2'

      - name: Compute nightly version
        id: nightly_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required for gh CLI to authenticate
          INPUT_BASE: ${{ github.event.inputs.nightly-base-version }}
        run: |
          set -euo pipefail
          set -x
          trap 'rc=$?; echo "ERROR on line $LINENO, command: $BASH_COMMAND, exit code: $rc"; exit $rc' ERR

          DATE=$(date -u +'%Y%m%d')
          echo "DATE=$DATE"

          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v '-' | sort -V | tail -1)
          echo "LATEST_RELEASE=$LATEST_RELEASE"

          MAJOR=$(echo "$LATEST_RELEASE" | cut -d. -f1)
          MINOR=$(echo "$LATEST_RELEASE" | cut -d. -f2)
          PATCH=$(echo "$LATEST_RELEASE" | cut -d. -f3)
          echo "MAJOR=$MAJOR"
          echo "MINOR=$MINOR"
          echo "PATCH=$PATCH"

          NEXT_PATCH=$((PATCH + 1))
          BASE="${INPUT_BASE:-${MAJOR}.${MINOR}.${NEXT_PATCH}}"
          PREFIX="${BASE}-nightly.${DATE}"
          echo "BASE=$BASE"
          echo "PREFIX=$PREFIX"

          # Get the number of existing tags for today
          COUNT=$(gh api "/repos/anyproto/anytype-heart/git/matching-refs/tags/$PREFIX" --jq 'length')
          echo "COUNT=$COUNT"

          # Build the final version string
          N=$((COUNT + 1))
          VERSION="${PREFIX}.${N}"
          echo "VERSION=$VERSION"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set env vars
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          INHOUSE_KEY: ${{ secrets.INHOUSE_KEY }}
        run: |
          GIT_SUMMARY=${{ steps.nightly_info.outputs.version }}
          echo "FLAGS=-X github.com/anyproto/anytype-heart/util/vcs.GitSummary=${GIT_SUMMARY} -X github.com/anyproto/anytype-heart/metrics.DefaultInHouseKey=${INHOUSE_KEY} -X github.com/anyproto/anytype-heart/util/unsplash.DefaultToken=${UNSPLASH_KEY}" >> $GITHUB_ENV

          VERSION=${{ steps.nightly_info.outputs.version }}
          echo "${{ secrets.STAGING_NODE_CONF }}" > ./core/anytype/config/nodes/custom.yml

          echo VERSION=${VERSION} >> $GITHUB_ENV
          echo BUILD_TAG_NETWORK=${{ github.event.inputs.build-tag-network || 'envproduction' }} >> $GITHUB_ENV
          echo MAVEN_ARTIFACT_VERSION=${VERSION} >> $GITHUB_ENV
          echo GOPRIVATE=github.com/anyproto >> $GITHUB_ENV
          NDK28=$(ls -d ${ANDROID_HOME}/ndk/28.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK28" ]; then echo "ERROR: NDK 28.x not found"; ls ${ANDROID_HOME}/ndk/; exit 1; fi
          echo "Using NDK: $NDK28"
          echo ANDROID_NDK=$NDK28 >> $GITHUB_ENV
          echo ANDROID_NDK_HOME=$NDK28 >> $GITHUB_ENV
          echo ANDROID_NDK_ROOT=$NDK28 >> $GITHUB_ENV
          echo $(pwd)/deps >> $GITHUB_PATH
          echo "${GOBIN}" >> $GITHUB_PATH
          git config --global url."https://${{ secrets.ANYTYPE_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Go mod download
        run: go mod download

      - name: install protoc
        run: make setup-protoc

      - name: setup go
        run: |
          make setup-go
          make setup-gomobile
          which gomobile

      - name: Cross-compile library mac/win/linux
        run: |
          make cross-compile-library
          ls -lha .

      - name: Make JS protos
        run: |
          make protos-js
          make ci-js-protos

      - name: Add system relations/types jsons
        run: make ci-add-system-relations-types-jsons

      - name: Pack servers
        run: make pack-server

      - name: Make swift protos
        run: make swift-protos

      - name: Compile ios lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          MAVEN_ARTIFACT_ID: 'anytype-heart-ios'
          MAVEN_ARTIFACT_NAME: 'ios_framework.tar.gz'
          PUBLISH_GRADLE: 1
        run: make compile-ios-lib

      - name: Make java protos
        run: make ci-java-protos

      - name: Compile android lib
        run: make compile-android-lib

      - name: Publish android lib to maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          MAVEN_ARTIFACT_ID: 'anytype-heart-android'
          MAVEN_ARTIFACT_NAME: 'lib.aar'
        run: |
          gradle publish

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.nightly_info.outputs.version }} # create new tag
          target_commitish: ${{ github.sha }}                 # set current commit for new tag
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: '.release/*'

      - name: Get release info
        id: release_info
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number(`${{ steps.release.outputs.id }}`);
            const { data } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id
            });
            core.setOutput('body', data.body || '');
            core.setOutput('html_url', data.html_url);
            core.setOutput('tag_name', data.tag_name);

  notify:
    needs:
      - build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Nightly Builds workflow in repo anyproto/anytype-ts
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ANYTYPE_TS_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/anyproto/anytype-ts/actions/workflows/nightly.yml/dispatches \
            -d '{"ref":"develop","inputs":{"run-diff-check":"false"}}'

      - name: Trigger integration tests in anytype-suite
        if: needs.build.outputs.tag_name != ''
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ANYTYPE_SUITE_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/anyproto/anytype-suite/dispatches \
            -d "{\"event_type\": \"test-release\", \"client_payload\": {\"version\": \"${{ needs.build.outputs.tag_name }}\"}}"

      - name: Notify Telegram (workflow result)
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && secrets.TELEGRAM_CHAT_ID_ALERTS || secrets.TELEGRAM_CHAT_ID_RELEASE_TRAIN }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '❌' || '✅' }} <b>Nightly / anytype-heart</b>

            <b>Release:</b> ${{ needs.build.outputs.tag_name && format('<a href="{1}">{0}</a>', needs.build.outputs.tag_name, needs.build.outputs.html_url) || 'none' }}
            <b>Description:</b>
            ${{ needs.build.outputs.body || 'no changes, build skipped' }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>
